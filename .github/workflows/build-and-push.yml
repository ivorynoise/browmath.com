name: Browmath [Build and Push]

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0-dev)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: central-harbor.ext.synthlane.com
          username: ${{ secrets.INFISICAL_HARBOR_USERNAME}}
          password: ${{ secrets.INFISICAL_HARBOR_PASSWORD}}

      - name: Build and Push
        run: ./build.sh ${{ inputs.version }}
